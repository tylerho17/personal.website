<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selected work — tyler ho</title>
    <meta name="description" content="selected work by tyler ho — tools, studies, and experiments.">
    <meta property="og:title" content="selected work — tyler ho">
    <meta property="og:description" content="tools, studies, and experiments.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #fefdfb;
            color: #3a3530;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ─── header ─── */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .logo {
            font-size: 14px;
            font-weight: 400;
            color: #3a3530;
            pointer-events: auto;
            cursor: pointer;
            text-decoration: none;
        }

        .hamburger {
            width: 30px; height: 20px;
            display: flex; flex-direction: column;
            justify-content: space-between;
            background: none; border: none;
            cursor: pointer; padding: 0;
            pointer-events: auto;
        }
        .hamburger span {
            width: 100%; height: 1px;
            background-color: #3a3530;
            transition: all 0.3s ease;
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

        /* ─── the index — an archive drawer, not a menu ─── */
        nav {
            position: fixed;
            top: 0; right: -320px;
            width: 320px; height: 100vh;
            background-color: #fefdfb;
            padding: 100px 44px 44px;
            z-index: 99;
            transition: right 0.45s ease;
            border-left: 1px solid #ede8e2;
            overflow-y: auto;
        }
        nav.active { right: 0; }
        .menu-title {
            font-size: 10px;
            color: #b8b0a8;
            letter-spacing: 0.14em;
            margin-bottom: 26px;
        }
        .index-row {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 9px 0;
            text-decoration: none;
        }
        .index-num {
            font-size: 10px;
            letter-spacing: 0.08em;
            color: #8d99ab;
            width: 18px;
            flex-shrink: 0;
        }
        .index-name {
            display: block;
            font-size: 14px;
            color: #3a3530;
            transition: color 0.2s;
        }
        .index-sub {
            display: block;
            font-size: 10px;
            color: #b8b0a8;
            margin-top: 1px;
        }
        .index-row:hover .index-name { color: #46586e; }
        .menu-materials-label {
            margin-top: 44px;
            padding-top: 18px;
            border-top: 1px solid #ede8e2;
            font-size: 10px;
            color: #b8b0a8;
            letter-spacing: 0.12em;
        }
        .menu-materials {
            font-size: 11px;
            color: #b8b0a8;
            margin-top: 8px;
            line-height: 1.7;
        }

        /* ─── page ─── */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 130px 40px 80px;
            animation: fadeUp 0.7s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .page-eyebrow {
            font-size: 11px;
            color: #b8b0a8;
            letter-spacing: 0.09em;
            margin-bottom: 8px;
        }
        .page-title {
            font-size: 15px;
            color: #3a3530;
            margin-bottom: 6px;
        }
        .page-sub {
            font-size: 12px;
            color: #b8b0a8;
            margin-bottom: 48px;
        }

        /* ─── the work list — compact, field-notes scale ─── */
        .work-list {
            display: flex;
            flex-direction: column;
        }

        .work-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-top: 1px solid #ede8e2;
            text-decoration: none;
            color: inherit;
        }
        .work-item:last-child { border-bottom: 1px solid #ede8e2; }

        /* the clean white box around the logo */
        .work-logo {
            flex-shrink: 0;
            width: 64px;
            height: 64px;
            background: #ffffff;
            border: 1px solid #ede8e2;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 11px;
            box-shadow: 0 1px 3px rgba(58,53,48,0.05);
            transition: box-shadow 0.25s ease;
        }
        .work-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .work-item:hover .work-logo { box-shadow: 0 3px 10px rgba(58,53,48,0.10); }

        .work-meta { min-width: 0; }
        .work-name a {
            font-size: 14px;
            color: #3a3530;
            text-decoration: none;
            transition: color 0.2s;
        }
        .work-name a:hover { color: #46586e; }
        .work-desc {
            margin-top: 2px;
            font-size: 12px;
            color: #8a807a;
            line-height: 1.5;
        }

        /* ─── responsive ─── */
        @media (max-width: 640px) {
            header { padding: 28px 24px; }
            main { padding: 110px 20px 60px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<header>
    <a class="logo" href="/">tyler ho</a>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="menu">
        <span></span><span></span><span></span>
    </button>
</header>

<nav id="menu" aria-label="index">
    <div class="menu-title">index</div>

    <a class="index-row" href="/" onclick="closeMenu()">
        <span class="index-num">01</span>
        <span><span class="index-name">letter</span><span class="index-sub">home</span></span>
    </a>
    <a class="index-row" href="/archive/" onclick="closeMenu()">
        <span class="index-num">02</span>
        <span><span class="index-name">photographs</span><span class="index-sub">archive</span></span>
    </a>
    <a class="index-row" href="/field-notes/" onclick="closeMenu()">
        <span class="index-num">03</span>
        <span><span class="index-name">notes</span><span class="index-sub">field notes</span></span>
    </a>
    <a class="index-row" href="/selected-work/" onclick="closeMenu()">
        <span class="index-num">04</span>
        <span><span class="index-name">work</span><span class="index-sub">selected work</span></span>
    </a>

    <div class="menu-materials-label">materials</div>
    <div class="menu-materials">photographs · notes · people · places · work</div>
</nav>

<main>
    <div class="page-eyebrow">selected work</div>
    <div class="page-title">tools, studies &amp; experiments</div>
    <div class="page-sub">things i've built.</div>

    <div class="work-list">

        <!-- ─── AidPilot ─── -->
        <div class="work-item">
            <div class="work-logo"><img src="/Photos/aidpilot-logo.png" alt="AidPilot"></div>
            <div class="work-meta">
                <div class="work-name"><a href="https://aidpilot.app" target="_blank" rel="noopener">AidPilot</a></div>
                <div class="work-desc">helps students understand their financial aid offers and file the fafsa.</div>
            </div>
        </div>

    </div>
</main>

<script>
function toggleMenu() {
    document.getElementById('menu').classList.toggle('active');
    document.getElementById('hamburger').classList.toggle('active');
}
function closeMenu() {
    document.getElementById('menu').classList.remove('active');
    document.getElementById('hamburger').classList.remove('active');
}
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeMenu();
});
document.addEventListener('click', e => {
    const menu = document.getElementById('menu');
    if (!menu.classList.contains('active')) return;
    if (!menu.contains(e.target) && !e.target.closest('.hamburger')) closeMenu();
});
</script>
</body>
</html>
